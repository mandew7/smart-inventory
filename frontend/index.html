<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Inventory | Панель управления</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        #logs-list::-webkit-scrollbar { width: 4px; }
        #logs-list::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <!-- Заголовок -->
        <div class="flex items-center justify-between mb-10">
            <h1 class="text-3xl font-bold text-gray-800 flex items-center gap-3">
                <span>📦</span> Smart Inventory
            </h1>
            <span id="status-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-500 transition-all duration-300">
                Проверка связи...
            </span>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Форма добавления товара -->
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 sticky top-8">
                    <h2 class="text-xl font-bold mb-6 text-gray-700">Новый товар</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Название</label>
                            <input id="name" type="text" placeholder="Например: iPhone 15" class="w-full border border-gray-200 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Цена ($)</label>
                            <input id="price" type="number" placeholder="0.00" class="w-full border border-gray-200 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Количество</label>
                            <input id="stock" type="number" value="10" class="w-full border border-gray-200 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
                        </div>
                        <button onclick="addProduct()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition transform active:scale-95 shadow-lg shadow-blue-200">
                            Добавить на склад
                        </button>
                    </div>
                </div>
            </div>

            <!-- Таблица и Фильтры -->
            <div class="lg:col-span-2">
                <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
                    <div class="flex bg-gray-200 p-1 rounded-xl w-full sm:w-auto">
                        <button onclick="setFilter('all')" id="btn-all" class="flex-1 sm:flex-none px-4 py-2 rounded-lg font-medium transition bg-white shadow-sm text-blue-600">Все</button>
                        <button onclick="setFilter('available')" id="btn-available" class="flex-1 sm:flex-none px-4 py-2 rounded-lg font-medium transition text-gray-600 hover:text-gray-900">В наличии</button>
                        <button onclick="setFilter('low')" id="btn-low" class="flex-1 sm:flex-none px-4 py-2 rounded-lg font-medium transition text-gray-600 hover:text-gray-900 text-nowrap">Дефицит</button>
                    </div>

                    <div class="flex items-center gap-3 bg-white px-4 py-2 rounded-xl border border-gray-100 shadow-sm ml-auto">
                        <span class="text-xs text-gray-400 font-bold uppercase tracking-wider">Порог:</span>
                        <input id="threshold" type="number" value="10" oninput="renderTable()" 
                            class="w-12 text-center font-bold text-blue-600 bg-transparent focus:outline-none">
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50 text-gray-500 text-sm uppercase">
                                <tr>
                                    <th class="p-4 font-semibold">Товар</th>
                                    <th class="p-4 font-semibold">Цена</th>
                                    <th class="p-4 font-semibold text-center">Склад</th>
                                    <th class="p-4 font-semibold text-right">Действие</th>
                                </tr>
                            </thead>
                            <tbody id="products-table" class="divide-y divide-gray-100">
                                <tr><td colspan="4" class="p-8 text-center text-gray-400 italic">Загрузка данных...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Секция Логов -->
                <div class="mt-8 bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-6 border-b border-gray-50 bg-gray-50/50 flex justify-between items-center">
                        <h2 class="font-bold text-gray-700">Последние действия</h2>
                        <button onclick="fetchData()" class="text-blue-500 hover:rotate-180 transition duration-500 text-xl">🔄</button>
                    </div>
                    <ul id="logs-list" class="divide-y divide-gray-100 max-h-60 overflow-y-auto">
                        <li class="p-4 text-center text-gray-400">Загрузка истории...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ВАЖНО: Слеш в конце обязателен, чтобы избежать лишних редиректов и ошибок CORS
        const API_URL = "http://127.0.0.1:8000/products/";
        let allProducts = [];
        let currentFilter = 'all';

        async function fetchData() {
            const badge = document.getElementById('status-badge');
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("API Error");
                
                allProducts = await response.json();
                renderTable();
                await fetchLogs();

                badge.innerText = "Система онлайн";
                badge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700";
            } catch (error) {
                console.error("Fetch error:", error);
                badge.innerText = "Ошибка связи с сервером";
                badge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-700";
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            ['all', 'available', 'low'].forEach(f => {
                const btn = document.getElementById(`btn-${f}`);
                if (f === filter) {
                    btn.classList.add('bg-white', 'shadow-sm', 'text-blue-600');
                    btn.classList.remove('text-gray-600');
                } else {
                    btn.classList.remove('bg-white', 'shadow-sm', 'text-blue-600');
                    btn.classList.add('text-gray-600');
                }
            });
            renderTable();
        }

        function renderTable() {
            const table = document.getElementById('products-table');
            const threshold = parseInt(document.getElementById('threshold').value) || 0;
            table.innerHTML = '';

            const filtered = allProducts.filter(p => {
                if (currentFilter === 'available') return p.stock > 0;
                if (currentFilter === 'low') return p.stock > 0 && p.stock < threshold;
                return true;
            });

            if (filtered.length === 0) {
                table.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-gray-400 italic">Ничего не найдено</td></tr>`;
                return;
            }

            filtered.forEach(p => {
                const isCritical = p.stock < threshold && p.stock > 0;
                const isOutOfStock = p.stock <= 0;

                table.innerHTML += `
                    <tr class="hover:bg-gray-50 transition ${isOutOfStock ? 'bg-gray-50/50 opacity-60' : ''}">
                        <td class="p-4">
                            <div class="font-semibold text-gray-800">${p.name}</div>
                            ${isCritical ? '<span class="text-[10px] text-orange-600 font-bold uppercase tracking-tighter">Нужна закупка!</span>' : ''}
                            ${isOutOfStock ? '<span class="text-[10px] text-red-500 font-bold uppercase tracking-tighter">Нет на складе</span>' : ''}
                        </td>
                        <td class="p-4 text-gray-600 font-medium">$${p.price}</td>
                        <td class="p-4 text-center">
                            <span class="px-3 py-1 rounded-lg font-bold ${p.stock < threshold ? 'bg-red-100 text-red-600' : 'bg-blue-50 text-blue-600'}">
                                ${p.stock}
                            </span>
                        </td>
                        <td class="p-4 text-right flex justify-end gap-2">
                            <button onclick="sellOne(${p.id})" 
                                ${isOutOfStock ? 'disabled' : ''}
                                class="${isOutOfStock ? 'opacity-30 cursor-not-allowed' : 'hover:bg-green-600 hover:text-white'} text-green-600 border border-green-200 px-3 py-1 rounded-lg transition">
                                Продать
                            </button>
                            <button onclick="deleteProduct(${p.id})" class="text-gray-300 hover:text-red-500 transition p-1 text-xl">
                                🗑️
                            </button>
                        </td>
                    </tr>`;
            });
        }

        async function fetchLogs() {
            try {
                // Запрос пойдет на /products/logs/
                const response = await fetch(`${API_URL}logs`);
                if (!response.ok) return;
                
                const logs = await response.json();
                const logsList = document.getElementById('logs-list');
                logsList.innerHTML = '';

                if (!logs || logs.length === 0) {
                    logsList.innerHTML = '<li class="p-4 text-center text-gray-400">История пуста</li>';
                    return;
                }

                logs.slice().reverse().slice(0, 15).forEach(log => {
                    const date = new Date(log.timestamp).toLocaleTimeString();
                    const isSell = log.action === 'sell';
                    logsList.innerHTML += `
                        <li class="p-4 flex justify-between items-center text-sm hover:bg-gray-50 transition">
                            <div class="flex items-center gap-3">
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${isSell ? 'bg-orange-100 text-orange-600' : 'bg-green-100 text-green-600'}">
                                    ${isSell ? 'Продажа' : 'Приход'}
                                </span>
                                <span class="text-gray-500 font-medium text-xs">ID товара: ${log.product_id}</span>
                            </div>
                            <div class="flex items-center gap-4">
                                <span class="font-bold text-gray-700">${log.quantity} шт.</span>
                                <span class="text-gray-400 text-[10px]">${date}</span>
                            </div>
                        </li>`;
                });
            } catch (e) { console.error("Logs error:", e); }
        }

        async function addProduct() {
            const nameInp = document.getElementById('name');
            const priceInp = document.getElementById('price');
            const stockInp = document.getElementById('stock');

            if(!nameInp.value || !priceInp.value) return alert("Заполните название и цену!");

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: nameInp.value,
                        price: parseFloat(priceInp.value),
                        stock: parseInt(stockInp.value),
                        description: "Добавлено из веб-панели",
                        category_id: 1 // УБЕДИТЕСЬ, ЧТО КАТЕГОРИЯ С ID 1 ЕСТЬ В БД
                    })
                });

                if(res.ok) {
                    nameInp.value = '';
                    priceInp.value = '';
                    fetchData();
                } else {
                    const errorData = await res.json();
                    alert(`Ошибка сервера: ${JSON.stringify(errorData.detail)}`);
                }
            } catch (e) { 
                alert("Ошибка при добавлении. Проверьте настройки CORS в бэкенде."); 
            }
        }

        async function sellOne(id) {
            try {
                // Путь /products/{id}/sell
                const res = await fetch(`${API_URL}${id}/sell?quantity=1`, { method: 'POST' });
                if (res.ok) {
                    fetchData();
                } else {
                    const err = await res.json();
                    alert(err.detail || "Не удалось продать");
                }
            } catch (e) { alert("Ошибка сети"); }
        }

        async function deleteProduct(id) {
            if (!confirm("Вы уверены? Это действие нельзя отменить.")) return;
            try {
                // Путь /products/{id}
                const res = await fetch(`${API_URL}${id}`, { method: 'DELETE' });
                if (res.ok) {
                    fetchData();
                } else {
                    const err = await res.json().catch(() => ({detail: "Ошибка удаления"}));
                    alert(`Ошибка: ${err.detail}`);
                }
            } catch (e) { alert("Ошибка сети при удалении"); }
        }

        fetchData();
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
